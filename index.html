<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b37">
  <title>Happy Birthday, Ella!</title>
  <style>
    :root { font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; overflow: hidden; background: #a6d6d5; color: #102b37; transition: background 1.25s ease, color .7s ease; }
    body.night { background: #091823; color: #f7fbff; }
    body.blackout { background: #03070d; }
    main { z-index: 3; position: relative; display:flex; flex-direction:column; align-items:center; padding: 28px 18px; width: min(100%, 700px); text-align:center; }
    .hint { font-size: clamp(14px, 2.5vw, 18px); letter-spacing:.08em; text-transform:uppercase; font-weight:700; opacity:.75; margin-bottom: 15px; }
    .stage { position:relative; display:flex; justify-content:center; align-items:center; width:min(100%, 440px); height: 280px; }
    .stage::before { content:""; pointer-events:none; position:absolute; inset:-65px; opacity:0; background:radial-gradient(circle at center,rgba(255,190,54,.4),transparent 60%); transition:opacity .8s; filter:blur(12px); }
    body.night .stage::before { opacity:1; }
    body.blackout .stage::before { opacity:0; }
    .birthday-button { position:relative; display:flex; align-items:center; justify-content:center; width:245px; height:100px; border:0; border-radius:16px; background: #fffafa; color:#213543; font:800 22px/1.25 inherit; font-family:inherit; font-size:22px; font-weight:800; cursor:pointer; box-shadow:0 13px 0 #d9c5c9,0 25px 35px #1236; transition:transform .35s,opacity .3s,box-shadow .3s; z-index:2; }
    .birthday-button:not(:disabled):hover { transform:translateY(-5px); box-shadow:0 18px 0 #d9c5c9,0 30px 35px #1236; }
    .birthday-button:focus-visible,.controls button:focus-visible { outline:3px solid #f69b37; outline-offset:5px; }
    .birthday-button:disabled { cursor:default; }
    .stage.celebrating .birthday-button { transform:translateY(78px) scale(.92); opacity:0; pointer-events:none; }
    .cake-wrap { pointer-events:none; position:absolute; left:50%; top:50%; width:300px; transform:translate(-50%,-40%) scale(.7); opacity:0; transition:transform .9s cubic-bezier(.18,1.45,.4,1), opacity .45s; }
    .stage.celebrating .cake-wrap { transform:translate(-50%,-50%) scale(1); opacity:1; }
    .cake-svg { width:100%; overflow:visible; filter:drop-shadow(0 14px 7px rgba(0,0,0,.2)); }
    .frosting { transform:scaleY(0); transform-origin:150px 105px; transition:transform .85s ease .55s; }
    .stage.frosted .frosting { transform:scaleY(1); }
    .sprinkles { opacity:0; transition:opacity .4s .25s; }
    .stage.frosted .sprinkles {opacity:1;}
    .candle { transform:scaleY(0); transform-origin:center 94px; transition:transform .5s cubic-bezier(.2,1.6,.4,1); }
    .stage.candles .candle { transform:scaleY(1); }
    .flame { opacity:0; transform-origin:center 58px; }
    .stage.lit .flame { opacity:1; filter:drop-shadow(0 0 5px rgba(255,173,48,.8)); }
    .eyes { transform-origin:center; animation:blink 5s infinite; }
    .message { margin: 0 auto; max-width:510px; font-size:clamp(18px,2.8vw,25px); line-height:1.55; opacity:0; transform:translateY(14px); transition:opacity .8s,transform .8s; }
    .message.visible { opacity:1; transform:translateY(0); }
    .message strong {display:block;font-size:clamp(26px,5vw,40px);margin-bottom:10px;}
    .controls { position:fixed; bottom:20px; right:20px; z-index:6; display:flex; gap:10px; }
    .controls button { border:1px solid #9fadb7; border-radius:100px; background:#f8fbfc; color:#102b37; padding:11px 16px; cursor:pointer; font:600 14px system-ui,sans-serif; box-shadow:0 4px 16px #0002; }
    .controls #replay { display:none; }
    .controls #replay.visible { display:inline-block; }
    canvas { position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5; }
    @keyframes blink { 0%,43%,45%,80%,82%,100% {transform:scaleY(1)} 44%,81% {transform:scaleY(.12)} }
    @media (prefers-reduced-motion: reduce) { *,*::before,*::after { animation-duration:.01ms !important; transition-duration:.01ms !important; } }
    @media (max-width:420px) { .stage {height:255px}.controls {bottom:12px;right:12px;} .controls button {padding:10px 12px;} }
  </style>
</head>
<body>
  <canvas id="confetti" aria-hidden="true"></canvas>
  <main>
    <div class="hint" id="hint">A little surprise for you ✨</div>
    <div class="stage" id="stage">
      <button id="start" class="birthday-button" type="button">🎂 Happy Birthday!</button>
      <div class="cake-wrap" aria-hidden="true">
        <svg class="cake-svg" viewBox="0 0 300 215" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="150" cy="195" rx="139" ry="13" fill="#122633" opacity=".18"/>
          <rect x="36" y="105" width="228" height="86" rx="16" fill="#f8acb8"/>
          <path d="M36 139 Q75 155 112 139 T188 139 T264 139 V173 Q227 185 188 173 T112 173 T36 173Z" fill="#ef8da8" opacity=".55"/>
          <rect x="36" y="105" width="228" height="43" rx="16" fill="#f9eef4" class="frosting"/>
          <g class="frosting" fill="#f9eef4">
            <path d="M38 128 Q48 159 59 132 Q69 117 80 139 Q91 166 103 137 Q115 120 127 140 Q139 162 150 139 Q163 118 175 140 Q187 167 199 137 Q212 118 223 139 Q237 166 248 133 Q259 118 263 128L263 111H38Z"/>
          </g>
          <g class="sprinkles" stroke-width="5" stroke-linecap="round">
            <path d="M57 124l10 5 M90 120l8 -6 M121 128l-7 8 M155 117l7 8 M182 130l9 -4 M220 120l8 8 M247 128l-7 8" stroke="#fe9c29"/>
            <path d="M71 141l7 7 M108 118l6 8 M140 125l-8 6 M206 124l7 7 M235 142l8 -6" stroke="#44c9c7"/>
          </g>
          <g class="eyes" fill="#162733"><ellipse cx="115" cy="160" rx="7" ry="9"/><ellipse cx="185" cy="160" rx="7" ry="9"/></g>
          <path d="M139 171 Q150 188 161 171Z" fill="#582c42"/><ellipse cx="153" cy="180" rx="6" ry="3" fill="#e96991"/>
          <g class="candle"><rect x="72" y="60" width="14" height="46" rx="4" fill="#f3d8fd"/><path d="M75 67l8 6M75 80l8 6M75 93l8 6" stroke="#b486c7" stroke-width="3"/><g class="flame"><path d="M79 34Q92 50 79 62Q65 50 79 34" fill="#ff9e23"/><path d="M79 45Q85 53 79 59Q73 53 79 45" fill="#fff47b"/></g></g>
          <g class="candle" style="transition-delay:.12s"><rect x="143" y="47" width="14" height="59" rx="4" fill="#b1eaf3"/><path d="M146 58l8 6M146 73l8 6M146 88l8 6" stroke="#51a6bf" stroke-width="3"/><g class="flame"><path d="M150 21Q163 37 150 49Q136 37 150 21" fill="#ff9e23"/><path d="M150 32Q156 40 150 46Q144 40 150 32" fill="#fff47b"/></g></g>
          <g class="candle" style="transition-delay:.24s"><rect x="214" y="60" width="14" height="46" rx="4" fill="#ffe5ad"/><path d="M217 67l8 6M217 80l8 6M217 93l8 6" stroke="#e2af60" stroke-width="3"/><g class="flame"><path d="M221 34Q234 50 221 62Q207 50 221 34" fill="#ff9e23"/><path d="M221 45Q227 53 221 59Q215 53 221 45" fill="#fff47b"/></g></g>
        </svg>
      </div>
    </div>
    <p class="message" id="message" aria-live="polite"><strong>Happy Birthday, Ella!</strong>Wishing you a wonderful birthday and a year filled with happiness and success!</p>
  </main>
  <div class="controls">
    <button type="button" id="sound" aria-pressed="true">🔊 Sound on</button>
    <button type="button" id="replay">↻ Replay</button>
  </div>
<script>
(() => {
  'use strict';
  const stage = document.getElementById('stage');
  const start = document.getElementById('start');
  const hint = document.getElementById('hint');
  const message = document.getElementById('message');
  const soundBtn = document.getElementById('sound');
  const replayBtn = document.getElementById('replay');
  const canvas = document.getElementById('confetti');
  const ctx = canvas.getContext('2d');
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let soundEnabled = true;
  let audioContext;
  let masterGain;
  let scheduledAudio = [];
  function audioOutput() {
    audioContext ??= new (window.AudioContext || window.webkitAudioContext)();
    if (!masterGain) {
      masterGain = audioContext.createGain();
      masterGain.gain.value = soundEnabled ? 1 : 0;
      masterGain.connect(audioContext.destination);
    }
    if (audioContext.state === 'suspended') audioContext.resume();
    return masterGain;
  }
  function stopAudio() {
    scheduledAudio.forEach(node => { try { node.stop(); } catch (_) {} });
    scheduledAudio = [];
  }
  let timers = [];
  let animationFrame;
  let particles = [];
  let run = 0;
  function schedule(fn, delay) { const id = window.setTimeout(fn, delay); timers.push(id); }
  function tone(freq, seconds, type='sine', gain=.11, offset=0) {
    if (!soundEnabled) return;
    try {
      const output = audioOutput();
      const oscillator = audioContext.createOscillator();
      const volume = audioContext.createGain();
      oscillator.type = type;
      oscillator.frequency.value = freq;
      const now = audioContext.currentTime + offset;
      volume.gain.setValueAtTime(.0001,now);
      volume.gain.exponentialRampToValueAtTime(gain, now+.02);
      volume.gain.exponentialRampToValueAtTime(.0001,now+seconds);
      oscillator.connect(volume).connect(output);
      oscillator.start(now); oscillator.stop(now+seconds+.01);
      scheduledAudio.push(oscillator);
    } catch(e) { console.info('Audio unavailable',e); }
  }
  // Original recordings from the supplied birthday animation (no JS libraries).
  // Audio files are streamed from the original CodePen asset URLs.
  const AUDIO_URLS = {
    cheer: 'https://s3-us-west-2.amazonaws.com/s.cdpn.io/605876/cheer.mp3',
    match: 'https://s3-us-west-2.amazonaws.com/s.cdpn.io/605876/match-strike-trimmed.mp3',
    tune: 'https://s3-us-west-2.amazonaws.com/s.cdpn.io/605876/happy-birthday-trimmed.mp3',
    on: 'https://assets.codepen.io/605876/switch-on.mp3',
    blow: 'https://s3-us-west-2.amazonaws.com/s.cdpn.io/605876/blow-out.mp3',
    pop: 'https://s3-us-west-2.amazonaws.com/s.cdpn.io/605876/pop-trimmed.mp3',
    horn: 'https://s3-us-west-2.amazonaws.com/s.cdpn.io/605876/horn.mp3'
  };
  const soundFiles = Object.fromEntries(Object.entries(AUDIO_URLS).map(([key, url]) => {
    const audio = new Audio(url);
    audio.preload = 'auto';
    audio.muted = !soundEnabled;
    return [key, audio];
  }));
  const activeSoundCopies = new Set();
  function originalSound(key, {clone=false}={}) {
    const audio = clone ? new Audio(AUDIO_URLS[key]) : soundFiles[key];
    if (!audio) return Promise.resolve(false);
    if (!clone) { audio.pause(); audio.currentTime=0; }
    audio.muted = !soundEnabled;
    if (clone) {
      activeSoundCopies.add(audio);
      audio.addEventListener('ended',()=>activeSoundCopies.delete(audio),{once:true});
      audio.addEventListener('error',()=>activeSoundCopies.delete(audio),{once:true});
    }
    const started = audio.play();
    return started ? started.then(()=>true).catch(()=>false) : Promise.resolve(true);
  }
  function stopRecordings() {
    for (const audio of [...Object.values(soundFiles), ...activeSoundCopies]) {
      audio.pause(); try { audio.currentTime=0; } catch (_) {}
    }
    activeSoundCopies.clear();
  }
  function noiseEffect(duration, peak, filterType='highpass', frequency=1300) {
    if (!soundEnabled) return;
    try {
      const output=audioOutput(), sampleRate=audioContext.sampleRate;
      const buffer=audioContext.createBuffer(1,Math.ceil(duration*sampleRate),sampleRate);
      const data=buffer.getChannelData(0);
      for(let i=0;i<data.length;i++) data[i]=Math.random()*2-1;
      const source=audioContext.createBufferSource();source.buffer=buffer;
      const filter=audioContext.createBiquadFilter();filter.type=filterType;filter.frequency.value=frequency;
      const volume=audioContext.createGain();const now=audioContext.currentTime;
      volume.gain.setValueAtTime(.0001,now);
      volume.gain.linearRampToValueAtTime(peak,now+Math.min(.035,duration/4));
      volume.gain.exponentialRampToValueAtTime(.0001,now+duration);
      source.connect(filter).connect(volume).connect(output);
      source.start(now);source.stop(now+duration+.005);scheduledAudio.push(source);
    } catch(e) {console.info('Sound effect unavailable',e);}
  }
  // Play the original recordings from start to finish. Resolve on ended,
  // not on HTMLAudioElement.play(), which only means playback started.
  function wait(ms) { return new Promise(resolve => schedule(resolve,ms)); }
  async function clip(key, thisRun, maxMs=30000) {
    if (thisRun !== run) return false;
    const audio=soundFiles[key];
    if(!audio) return false;
    audio.pause();
    try { audio.currentTime=0; } catch(_) {}
    audio.muted=!soundEnabled;
    return new Promise(resolve=>{
      let settled=false;
      let timeout;
      const finish=(ok)=>{
        if(settled)return;
        settled=true;
        clearTimeout(timeout);
        audio.removeEventListener('ended',ended);
        audio.removeEventListener('error',errored);
        resolve(ok && thisRun===run);
      };
      const ended=()=>finish(true);
      const errored=()=>finish(false);
      audio.addEventListener('ended',ended,{once:true});
      audio.addEventListener('error',errored,{once:true});
      timeout=setTimeout(()=>{audio.pause();finish(false);},maxMs);
      try {
        const playback=audio.play();
        if(playback && typeof playback.catch==='function') playback.catch(errored);
      } catch(_){errored();}
    });
  }
  async function sequenceClip(key, thisRun, fallbackDuration, maxMs=30000) {
    const ok=await clip(key,thisRun,maxMs);
    if(!ok && thisRun===run) await wait(fallbackDuration);
    return thisRun===run;
  }
  function syntheticMelodyDuration() {
    const notes=[392,392,440,392,523.25,493.88,392,392,440,392,587.33,523.25,392,392,783.99,659.25,523.25,493.88,440,698.46,698.46,659.25,523.25,587.33,523.25];
    const durations=[.23,.23,.46,.46,.46,.78,.23,.23,.46,.46,.46,.78,.23,.23,.46,.46,.46,.46,.85,.23,.23,.46,.46,.46,.9];
    let at=0;notes.forEach((note,i)=>{tone(note,durations[i]*.85,'triangle',.08,at);at+=durations[i];});
    return at*1000;
  }
  async function birthdaySong(thisRun) {
    const ok=await clip('tune',thisRun,60000);
    if(!ok && thisRun===run) await wait(syntheticMelodyDuration()+200);
    return thisRun===run;
  }
  function fitCanvas() { const dpr=Math.min(window.devicePixelRatio||1,2); canvas.width=Math.round(innerWidth*dpr); canvas.height=Math.round(innerHeight*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); }
  window.addEventListener('resize',fitCanvas); fitCanvas();
  function burst() {
    if (reducedMotion) return;
    particles=Array.from({length:150},()=>({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.36,vx:(Math.random()-.5)*12,vy:-Math.random()*10-2,g:.13+Math.random()*.14,size:4+Math.random()*6,angle:Math.random()*6.28,spin:(Math.random()-.5)*.18,color:['#f9bc4a','#fc799c','#4acac4','#ae91ef','#fff','#7fdefe'][Math.floor(Math.random()*6)]}));
    cancelAnimationFrame(animationFrame);
    let frames=0;
    function paint(){ctx.clearRect(0,0,innerWidth,innerHeight);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g;p.vx*=.992;p.angle+=p.spin;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.angle);ctx.fillStyle=p.color;ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.55);ctx.restore();}if(++frames<220) animationFrame=requestAnimationFrame(paint);else ctx.clearRect(0,0,innerWidth,innerHeight);}
    paint();
  }
  function reset() {
    timers.forEach(clearTimeout); timers=[];run++;
    stopAudio();
    stopRecordings();
    document.body.classList.remove('night','blackout');
    stage.className='stage';
    message.classList.remove('visible');
    hint.textContent='A little surprise for you ✨';
    start.disabled=false;
    start.hidden=false;
    replayBtn.classList.remove('visible');
    particles=[];cancelAnimationFrame(animationFrame);ctx.clearRect(0,0,innerWidth,innerHeight);
  }
  async function celebrate() {
    reset();
    const thisRun=run;
    start.disabled=true;
    hint.textContent='Making a birthday wish…';
    stage.classList.add('celebrating');
    // Await sounds in order so the opening cheer, candle pops,
    // match strike, song, and blowing sound never interrupt one another.
    if(!await sequenceClip('on',thisRun,1800,8000)) return;
    if(!await sequenceClip('cheer',thisRun,1600,12000)) return;
    if(!await sequenceClip('horn',thisRun,800,6000)) return;
    stage.classList.add('frosted');
    await wait(700);
    if(thisRun!==run)return;
    stage.classList.add('candles');
    for(let i=0;i<3;i++) {
      if(!await sequenceClip('pop',thisRun,260,5000))return;
      await wait(130);
      if(thisRun!==run)return;
    }
    hint.textContent='Lighting the candles…';
    if(!await sequenceClip('match',thisRun,650,7000))return;
    stage.classList.add('lit');
    document.body.classList.add('night');
    hint.textContent='Make a wish! ✨';
    if(!await birthdaySong(thisRun))return;
    // Blow only after the full birthday recording has ended.
    hint.textContent='Blowing out the candles…';
    stage.classList.remove('lit');
    document.body.classList.add('blackout');
    if(!await sequenceClip('blow',thisRun,850,8000))return;
    await wait(350);
    if(thisRun!==run)return;
    document.body.classList.remove('blackout','night');
    hint.textContent='🎉 Surprise! 🎉';
    burst();
    message.classList.add('visible');
    // Play the original happy cheering sound again on the surprise screen.
    // It cannot overlap with the birthday song or blowing effect above.
    clip('cheer',thisRun,12000);
    schedule(()=>{if(thisRun===run){replayBtn.classList.add('visible');start.hidden=true;}},1700);
  }
  start.addEventListener('click',celebrate);
  replayBtn.addEventListener('click',celebrate);
  soundBtn.addEventListener('click',()=>{soundEnabled=!soundEnabled;soundBtn.textContent=soundEnabled?'🔊 Sound on':'🔇 Sound off';soundBtn.setAttribute('aria-pressed',String(soundEnabled));if(masterGain) masterGain.gain.value=soundEnabled?1:0;for(const a of [...Object.values(soundFiles),...activeSoundCopies]) a.muted=!soundEnabled;});
})();
</script>
</body>
</html>
